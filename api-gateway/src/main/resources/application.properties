spring.application.name=api-gateway
spring.config.import=optional:consul:
server.port=8080

# Health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Consul service discovery
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.register=false

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Project Service
spring.cloud.gateway.server.webmvc.routes[1].id=project-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://project-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/projects/**

# Task Service
spring.cloud.gateway.server.webmvc.routes[2].id=task-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://task-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/tasks/**

# Budget Service
spring.cloud.gateway.server.webmvc.routes[3].id=budget-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://budget-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/budgets/**

# Notification Service
spring.cloud.gateway.server.webmvc.routes[4].id=notification-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/notifications/**


logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG