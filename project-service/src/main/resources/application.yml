spring:
  application:
    name: project-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/projectdb}
    username: ${DB_USERNAME:rebuild}
    password: ${DB_PASSWORD:rebuild}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true


server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
