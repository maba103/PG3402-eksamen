spring.application.name=task-service
server.port=${SERVER_PORT:8082}


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5437/taskdb}
spring.datasource.username=${DB_USERNAME:task}
spring.datasource.password=${DB_PASSWORD:task}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
project.validation.enabled=${PROJECT_VALIDATION_ENABLED:false}
project.service.url=${PROJECT_SERVICE_URL:http://localhost:8085}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
task.messaging.topic=${TASK_TOPIC:task-events}
management.endpoints.web.exposure.include=health,info
spring.cloud.consul.enabled=${CONSUL_ENABLED:false}
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.enabled=${CONSUL_ENABLED:false}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s