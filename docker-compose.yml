services:
  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      consul:
        condition: service_healthy

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  budget-db:
    image: postgres:17
    container_name: budget-db
    environment:
      POSTGRES_DB: budgetdb
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
    ports:
      - "5433:5432"
    volumes:
      - budget-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budgetdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget-service:
    build:
      context: ./budget-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://budget-db:5432/budgetdb
      DB_USERNAME: budget
      DB_PASSWORD: budget
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      CONSUL_ENABLED: "true"
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      PROJECT_VALIDATION_ENABLED: "false"
    depends_on:
      budget-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      consul:
        condition: service_healthy

volumes:
  budget-db-data: