spring.application.name=budget-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/budgetdb}
spring.datasource.username=${DB_USERNAME:budget}
spring.datasource.password=${DB_PASSWORD:budget}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.config.import=optional:consul:
spring.cloud.consul.enabled=${CONSUL_ENABLED:false}
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.config.enabled=${CONSUL_ENABLED:false}
spring.cloud.consul.config.format=properties
spring.cloud.consul.discovery.enabled=${CONSUL_ENABLED:false}
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

spring.cloud.discovery.client.simple.instances.project-service[0].uri=${PROJECT_SERVICE_LOCAL_URL:http://localhost:8081}
budget.project-service.base-url=http://project-service
budget.project-service.project-path=/api/projects/{id}
budget.project-service.validation-enabled=${PROJECT_VALIDATION_ENABLED:true}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.properties.max.block.ms=5000

budget.messaging.topic=budget-events

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always